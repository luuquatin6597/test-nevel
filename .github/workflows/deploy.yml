name: Deploy Next.js to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.8.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Setup Pages
        uses: actions/configure-pages@v4
        with:
          static_site_generator: next

      - name: Install dependencies
        run: pnpm install

      - name: Build with Next.js
        run: NODE_ENV=production pnpm build
        env:
          NEXT_DISABLE_TURBOPACK: "1"

      - name: Verify build output
        run: |
          echo "=== Listing root directory ==="
          ls -la
          echo ""
          echo "=== Contents of .next/server ==="
          ls -la .next/server/
          echo ""
          echo "=== Checking if out directory exists ==="
          if [ -d "out" ]; then
            echo "✓ out directory exists"
            echo "=== Contents of out directory ==="
            ls -la out/
            echo ""
            echo "=== Checking for images ==="
            ls -la out/images/ | head -10 || echo "images directory not found!"
          else
            echo "✗ out directory NOT FOUND!"
            echo "=== Trying to create out from .next/server/app ==="
            if [ -d ".next/server/app" ]; then
              mkdir -p out
              cp -r .next/server/app/* out/
              cp -r .next/static out/_next/
              cp -r public/* out/
              echo "✓ Created out directory manually"
              ls -la out/
            else
              echo "✗ .next/server/app also not found"
              exit 1
            fi
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
