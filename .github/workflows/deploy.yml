name: Deploy Next.js to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.8.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Setup Pages
        uses: actions/configure-pages@v4
        with:
          static_site_generator: next

      - name: Install dependencies
        run: pnpm install

      - name: Build with Next.js
        run: pnpm build
        env:
          NODE_ENV: production

      - name: Export static files
        run: |
          echo "Looking for static export..."
          ls -la .next/

          # Check if standalone output exists
          if [ -d ".next/standalone" ]; then
            echo "Using standalone output"
            mkdir -p out
            cp -r .next/standalone/* out/
            cp -r .next/static out/_next/static
            cp -r public/* out/
          # Check if server app output exists  
          elif [ -d ".next/server/pages" ]; then
            echo "Copying from .next/server/pages"
            mkdir -p out
            cp -r .next/server/pages/* out/
            cp -r .next/static out/_next/static
            cp -r public/* out/
          else
            echo "ERROR: Cannot find static export output!"
            echo "Contents of .next/server:"
            ls -la .next/server/ || true
            exit 1
          fi

          echo "Final out directory:"
          ls -la out/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
